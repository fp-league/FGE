# Runs a database migration whenever one is added or changed.
#
# Separate from the deploy workflow on purpose: a migration changes the
# database, so it only fires when a file under worker/migrations/ actually
# changed in the push, never on an ordinary code change.
#
# Needs the same CLOUDFLARE_API_TOKEN secret as the deploy workflow.

name: Migrate

on:
  push:
    branches: [main]
    paths: ['worker/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prints the account this token can see. If the deploy ever fails with
      # "No account id found", the id is in this step's log.
      - name: Who am I
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: whoami

      # Every migration, in filename order. Deliberately a loop rather than a
      # list of files: adding 003 later should not need this workflow edited,
      # and forgetting to edit it is exactly how a migration silently never
      # runs. Each file is written to be safe to re-apply.
      - name: Apply every migration
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          for f in migrations/*.sql; do
            echo "── $f"
            npx --yes wrangler@4 d1 execute fge --remote --yes --file="$f"
          done

      - name: Deploy the Worker on top
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Check it answers
        run: |
          sleep 5
          curl -sS https://fge-api.benjaminjameswestley.workers.dev/api/live
          echo

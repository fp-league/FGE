name = "fge-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Where the browser is allowed to call this from.
# Add a localhost origin here while testing locally.
[vars]
ALLOWED_ORIGINS = "https://fp-league.github.io"
BIN_ID = "6ada83fdac6210605a4a3a74"
# Leave blank to serve images through the Worker at /img/<key>.
# Set it to a custom domain or r2.dev URL to serve straight from R2.
IMAGE_BASE_URL = ""

# D1 database. These ids are not secrets - they only identify the resource,
# and are useless without an API token. Cloudflare's own docs commit them.
# They were left as placeholders, which meant a deploy from CI could not find
# the database even with a valid token.
[[d1_databases]]
binding = "DB"
database_name = "fge"
database_id = "b355a2f6-42c4-4af2-a20d-7e35794466ce"

# Secrets are NOT set here. Set them once, from the terminal:
#   npx wrangler secret put BIN_READ_KEY   <- JSONBin read-only key
#   npx wrangler secret put VOTE_SALT      <- any long random string

# Image storage. KV is the default because it needs no payment details.
# Create it with:
#   npx wrangler kv namespace create IMAGES_KV
# then paste the id it prints below.
[[kv_namespaces]]
binding = "IMAGES_KV"
id = "fb32572a6cd54157a4109a48c4dd3060"

# Optional: R2 instead of KV, if you ever enable R2 on the account.
# Uncomment, create the bucket, redeploy - the Worker prefers R2 when bound.
#   npx wrangler r2 bucket create fge-images
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "fge-images"

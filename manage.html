<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FGE Admin</title>
<style>
@font-face { font-family:'911Porsche';      src:url('911porschav3.ttf')      format('truetype'); font-weight:normal;  font-display:swap; }
@font-face { font-family:'911Porsche';      src:url('911porschav3bold.ttf')  format('truetype'); font-weight:bold;    font-display:swap; }
@font-face { font-family:'911PorscheCond';  src:url('911porschav3cond.ttf')  format('truetype'); font-weight:normal;  font-display:swap; }
@font-face { font-family:'911PorscheTitle'; src:url('911porschav3title.ttf') format('truetype'); font-weight:normal;  font-display:swap; }

:root {
  --bg:      #000;
  --surface: #111;
  --surface2:#1a1a1a;
  --line:    rgba(255,255,255,0.08);
  --line2:   rgba(255,255,255,0.16);
  --white:   #fff;
  --off:     #f0f0f0;
  --grey:    #888;
  --grey2:   #555;
  --gt3:     #E10600;
  --gt4:     #0033A0;
  --gt4b:    #5599ff;
  --danger:  #c62828;
  --success: #2e7d32;
  --fd: '911PorscheTitle','911PorscheCond','911Porsche',Impact,sans-serif;
  --fu: '911PorscheCond','911Porsche','Arial Narrow',sans-serif;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--off); font-family:'Segoe UI',Arial,sans-serif; min-height:100vh; font-size:0.9rem; }

/* ── LOGIN ── */
.login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
.login-card { background:var(--surface); border:1px solid var(--line2); border-top:3px solid var(--white); border-radius:3px; padding:2.5rem; width:100%; max-width:340px; }
.login-card h2 { font-family:var(--fd); font-size:1.6rem; color:var(--white); letter-spacing:0.1em; margin-bottom:1.5rem; }
.login-card p { font-size:0.8rem; color:var(--grey); margin-top:0.7rem; }

/* ── HEADER ── */
.adm-header { position:sticky; top:0; z-index:200; background:var(--bg); border-bottom:1px solid var(--line2); height:56px; display:flex; align-items:center; padding:0 1.5rem; gap:1.5rem; }
.adm-logo { font-family:var(--fd); font-size:1.1rem; letter-spacing:0.12em; color:var(--white); flex:1; }
.adm-logo span { color:var(--grey); font-size:0.7rem; letter-spacing:0.2em; font-family:var(--fu); margin-left:0.6rem; vertical-align:middle; }
.adm-status { font-family:var(--fu); font-size:0.72rem; letter-spacing:0.1em; display:flex; align-items:center; gap:0.4rem; }
.status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.class-pills { display:flex; gap:4px; }
.cp-btn { background:transparent; border:1px solid var(--line2); color:var(--grey); padding:0.3rem 0.8rem; border-radius:2px; cursor:pointer; font-family:var(--fd); font-size:0.78rem; letter-spacing:0.1em; transition:all 0.2s; }
.cp-btn.gt3.active { border-color:var(--gt3); color:var(--gt3); background:rgba(225,6,0,0.08); }
.cp-btn.gt4.active { border-color:var(--gt4b); color:var(--gt4b); background:rgba(0,51,160,0.1); }
.adm-back { font-family:var(--fu); font-size:0.72rem; letter-spacing:0.1em; color:var(--grey); text-decoration:none; transition:color 0.2s; }
.adm-back:hover { color:var(--white); }

/* ── LAYOUT ── */
.adm-body { display:grid; grid-template-columns:200px 1fr; min-height:calc(100vh - 56px); }
@media(max-width:700px) { .adm-body { grid-template-columns:1fr; } }

/* ── SIDEBAR ── */
.adm-sidebar { border-right:1px solid var(--line); padding:1.2rem 0; background:var(--surface); }
@media(max-width:700px) {
  .adm-sidebar { border-right:none; border-bottom:1px solid var(--line); padding:0.5rem; display:flex; flex-wrap:wrap; gap:4px; }
}
.snav-item { display:flex; align-items:center; gap:0.6rem; padding:0.65rem 1.1rem; color:var(--grey); text-decoration:none; cursor:pointer; background:none; border:none; width:100%; text-align:left; font-family:var(--fu); font-size:0.8rem; letter-spacing:0.06em; border-left:2px solid transparent; transition:all 0.2s; }
.snav-item:hover { color:var(--white); background:rgba(255,255,255,0.03); }
.snav-item.active { color:var(--white); border-left-color:var(--white); background:rgba(255,255,255,0.05); }
.snav-icon { font-size:1rem; flex-shrink:0; }
@media(max-width:700px) {
  .snav-item { border-left:none; border-bottom:2px solid transparent; padding:0.45rem 0.8rem; border-radius:2px; width:auto; flex:1; min-width:60px; justify-content:center; font-size:0.72rem; text-align:center; flex-direction:column; gap:2px; }
  .snav-item.active { border-bottom-color:var(--white); background:rgba(255,255,255,0.07); }
}

/* ── MAIN ── */
.adm-main { padding:2rem 1.5rem; min-width:0; }
.adm-section { display:none; }
.adm-section.active { display:block; }

/* ── SECTION HEAD ── */
.sec-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.5rem; padding-bottom:0.7rem; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.sec-head h2 { font-family:var(--fd); font-size:1.2rem; color:var(--white); letter-spacing:0.1em; }

/* ── BUTTONS ── */
.btn { display:inline-flex; align-items:center; gap:0.4rem; padding:0.55rem 1.1rem; border-radius:2px; cursor:pointer; font-family:var(--fd); font-size:0.78rem; letter-spacing:0.1em; border:none; transition:all 0.2s; white-space:nowrap; }
.btn-white   { background:var(--white); color:var(--bg); }
.btn-white:hover { background:var(--off); }
.btn-ghost   { background:transparent; color:var(--grey); border:1px solid var(--line2); }
.btn-ghost:hover { color:var(--white); border-color:var(--white); }
.btn-danger  { background:rgba(198,40,40,0.15); color:#ef9a9a; border:1px solid rgba(198,40,40,0.3); }
.btn-danger:hover { background:rgba(198,40,40,0.25); }
.btn-confirm { background:var(--danger); color:#fff; }
.btn-sm { padding:0.3rem 0.65rem; font-size:0.7rem; }
.btn-icon { padding:0.3rem 0.5rem; font-size:0.9rem; }

/* ── FORMS ── */
.form-card { background:var(--surface); border:1px solid var(--line2); border-radius:3px; padding:1.5rem; margin-bottom:1.5rem; }
.form-card h3 { font-family:var(--fd); font-size:0.95rem; color:var(--white); letter-spacing:0.1em; margin-bottom:1.2rem; }
.form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:0.9rem; margin-bottom:0.9rem; }
.form-group { display:flex; flex-direction:column; gap:0.3rem; }
.fg-label { font-family:var(--fu); font-size:0.68rem; letter-spacing:0.1em; color:var(--grey); }
input, select, textarea { background:var(--surface2); border:1px solid var(--line2); color:var(--white); padding:0.55rem 0.8rem; border-radius:2px; font-size:0.88rem; font-family:'Segoe UI',sans-serif; width:100%; transition:border-color 0.2s; }
input:focus, select:focus, textarea:focus { outline:none; border-color:rgba(255,255,255,0.4); }
select option { background:var(--surface2); }
textarea { resize:vertical; min-height:80px; }
.form-actions { display:flex; gap:0.5rem; margin-top:0.8rem; }

/* ── TABLE ── */
.tbl-wrap { background:var(--surface); border:1px solid var(--line); border-radius:3px; overflow:hidden; overflow-x:auto; }
.adm-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
.adm-table thead th { font-family:var(--fu); font-size:0.66rem; letter-spacing:0.12em; color:var(--grey); padding:0.6rem 0.9rem; text-align:left; border-bottom:1px solid var(--line2); background:var(--surface2); white-space:nowrap; }
.adm-table tbody tr { border-bottom:1px solid rgba(255,255,255,0.03); transition:background 0.15s; }
.adm-table tbody tr:hover { background:rgba(255,255,255,0.03); }
.adm-table td { padding:0.6rem 0.9rem; vertical-align:middle; }
.td-actions { display:flex; gap:0.4rem; align-items:center; }

/* Inline delete confirm */
.del-confirm { display:none; align-items:center; gap:0.4rem; }
.del-confirm.show { display:flex; }

/* ── RESULTS FORM ── */
.res-row { display:grid; grid-template-columns:36px 1fr 140px; gap:0.5rem; align-items:center; margin-bottom:0.4rem; }
.res-pos { font-family:var(--fd); font-size:0.9rem; color:var(--grey); text-align:center; }
.add-row-btn { background:transparent; border:1px dashed var(--line2); color:var(--grey); padding:0.5rem 1rem; border-radius:2px; cursor:pointer; font-family:var(--fu); font-size:0.78rem; letter-spacing:0.08em; transition:all 0.2s; margin-top:0.3rem; }
.add-row-btn:hover { border-color:var(--white); color:var(--white); }

/* ── TOAST ── */
.toast { position:fixed; bottom:2rem; right:2rem; background:var(--surface2); border:1px solid var(--line2); color:var(--white); padding:0.7rem 1.2rem; border-radius:3px; font-family:var(--fu); font-size:0.82rem; letter-spacing:0.06em; z-index:999; opacity:0; transform:translateY(8px); transition:all 0.3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.ok { border-left:3px solid #4caf50; }
.toast.err { border-left:3px solid var(--danger); }

/* ── COLOR INPUT ── */
.color-pair { display:flex; gap:0.5rem; align-items:center; }
.color-pair input[type=color] { width:40px; height:36px; padding:2px; cursor:pointer; flex-shrink:0; }

/* ── EMPTY ── */
.empty-row td { padding:2rem; color:var(--grey); text-align:center; font-family:var(--fu); font-size:0.82rem; letter-spacing:0.06em; }

/* ── NEWS CARD IN TABLE ── */
.news-title { color:var(--white); font-weight:500; }
.news-tag { display:inline-block; font-family:var(--fu); font-size:0.64rem; letter-spacing:0.1em; padding:0.1rem 0.45rem; border-radius:2px; background:rgba(255,255,255,0.08); color:var(--grey); }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginWrap" class="login-wrap">
  <div class="login-card">
    <h2>FGE ADMIN</h2>
    <div class="form-group" style="margin-bottom:1rem">
      <label class="fg-label">PASSCODE</label>
      <input type="password" id="loginInput" placeholder="Enter passcode" onkeydown="if(event.key==='Enter')checkLogin()" autofocus>
    </div>
    <button class="btn btn-white" style="width:100%" onclick="checkLogin()">ENTER</button>
    <p id="loginErr" style="color:#ef9a9a;display:none;margin-top:0.6rem">Incorrect passcode.</p>
  </div>
</div>

<!-- ── ADMIN PANEL ── -->
<div id="adminPanel" style="display:none">

  <header class="adm-header">
    <div class="adm-logo">FGE <span>ADMIN</span></div>
    <div class="class-pills">
      <button class="cp-btn gt3 active" id="cpGT3" onclick="switchClass('GT3')">GT3</button>
      <button class="cp-btn gt4"        id="cpGT4" onclick="switchClass('GT4')">GT4</button>
    </div>
    <div class="adm-status" id="syncStatus"><span class="status-dot" style="background:#FF8000"></span>Loading</div>
    <a href="index.html" class="adm-back">← Site</a>
  </header>

  <div class="adm-body">
    <aside class="adm-sidebar" id="sidebar">
      <button class="snav-item active" onclick="showSec('news')"><span class="snav-icon">📰</span>News</button>
      <button class="snav-item"       onclick="showSec('drivers')"><span class="snav-icon">👤</span>Drivers</button>
      <button class="snav-item"       onclick="showSec('teams')"><span class="snav-icon">🏎</span>Teams</button>
      <button class="snav-item"       onclick="showSec('races')"><span class="snav-icon">🗓</span>Races</button>
      <button class="snav-item"       onclick="showSec('results')"><span class="snav-icon">🏁</span>Results</button>
      <button class="snav-item"       onclick="showSec('dotd')"><span class="snav-icon">⭐</span>DOTD</button>
      <button class="snav-item"       onclick="showSec('season')"><span class="snav-icon">⚙️</span>Season</button>
    </aside>

    <main class="adm-main">

      <!-- NEWS -->
      <div class="adm-section active" id="sec-news">
        <div class="sec-head">
          <h2>NEWS</h2>
          <button class="btn btn-white" onclick="openNewsForm()">+ Add Article</button>
        </div>

        <div class="form-card" id="newsForm" style="display:none">
          <h3 id="newsFormTitle">ADD ARTICLE</h3>
          <div class="form-grid">
            <div class="form-group"><label class="fg-label">TITLE</label><input id="nTitle" placeholder="Article title"></div>
            <div class="form-group"><label class="fg-label">TAG</label><input id="nTag" placeholder="Race Report, News, Update…"></div>
            <div class="form-group"><label class="fg-label">DATE</label><input id="nDate" type="date"></div>
            <div class="form-group"><label class="fg-label">IMAGE URL</label><input id="nImage" placeholder="https://…"></div>
          </div>
          <div class="form-group" style="margin-bottom:0.9rem"><label class="fg-label">EXCERPT</label><input id="nExcerpt" placeholder="One-line summary shown in news grid…"></div>
          <div class="form-group" style="margin-bottom:0.9rem"><label class="fg-label">BODY</label><textarea id="nBody" rows="5" placeholder="Full article text…"></textarea></div>
          <div class="form-actions">
            <button class="btn btn-white" onclick="saveNews()">SAVE</button>
            <button class="btn btn-ghost" onclick="closeNewsForm()">CANCEL</button>
          </div>
        </div>

        <div class="tbl-wrap">
          <table class="adm-table">
            <thead><tr><th>TITLE</th><th>TAG</th><th>DATE</th><th style="width:110px"></th></tr></thead>
            <tbody id="newsTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- DRIVERS -->
      <div class="adm-section" id="sec-drivers">
        <div class="sec-head">
          <h2>DRIVERS</h2>
          <button class="btn btn-white" onclick="openDriverForm()">+ Add Driver</button>
        </div>

        <div class="form-card" id="driverForm" style="display:none">
          <h3 id="driverFormTitle">ADD DRIVER</h3>
          <div class="form-grid">
            <div class="form-group"><label class="fg-label">FULL NAME</label><input id="dName" placeholder="First Last"></div>
            <div class="form-group"><label class="fg-label">NUMBER</label><input id="dNumber" type="number" placeholder="44"></div>
            <div class="form-group"><label class="fg-label">NATIONALITY</label><input id="dNat" placeholder="British"></div>
            <div class="form-group"><label class="fg-label">TEAM</label><select id="dTeam"><option value="">— Select Team —</option></select></div>
            <div class="form-group"><label class="fg-label">PHOTO URL</label><input id="dPhoto" placeholder="https://…"></div>
          </div>
          <div class="form-group" style="margin-bottom:0.9rem"><label class="fg-label">BIO</label><textarea id="dBio" rows="3" placeholder="Short driver bio…"></textarea></div>
          <div class="form-actions">
            <button class="btn btn-white" onclick="saveDriver()">SAVE</button>
            <button class="btn btn-ghost" onclick="closeDriverForm()">CANCEL</button>
          </div>
        </div>

        <div class="tbl-wrap">
          <table class="adm-table">
            <thead><tr><th>#</th><th>NAME</th><th>TEAM</th><th>NAT</th><th style="width:110px"></th></tr></thead>
            <tbody id="driversTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- TEAMS -->
      <div class="adm-section" id="sec-teams">
        <div class="sec-head">
          <h2>TEAMS</h2>
          <button class="btn btn-white" onclick="openTeamForm()">+ Add Team</button>
        </div>

        <div class="form-card" id="teamForm" style="display:none">
          <h3 id="teamFormTitle">ADD TEAM</h3>
          <div class="form-grid">
            <div class="form-group"><label class="fg-label">TEAM NAME</label><input id="tName" placeholder="Team name"></div>
            <div class="form-group">
              <label class="fg-label">COLOUR</label>
              <div class="color-pair">
                <input type="color" id="tColor" value="#E10600">
                <input id="tColorHex" value="#E10600" placeholder="#hex">
              </div>
            </div>
            <div class="form-group"><label class="fg-label">LOGO URL</label><input id="tLogo" placeholder="https://…"></div>
          </div>
          <div class="form-group" style="margin-bottom:0.9rem"><label class="fg-label">DESCRIPTION</label><textarea id="tDesc" rows="2" placeholder="Short team description…"></textarea></div>
          <div class="form-actions">
            <button class="btn btn-white" onclick="saveTeam()">SAVE</button>
            <button class="btn btn-ghost" onclick="closeTeamForm()">CANCEL</button>
          </div>
        </div>

        <div class="tbl-wrap">
          <table class="adm-table">
            <thead><tr><th>COLOUR</th><th>NAME</th><th>DESCRIPTION</th><th style="width:110px"></th></tr></thead>
            <tbody id="teamsTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- RACES -->
      <div class="adm-section" id="sec-races">
        <div class="sec-head">
          <h2>RACES</h2>
          <button class="btn btn-white" onclick="openRaceForm()">+ Add Race</button>
        </div>

        <div class="form-card" id="raceForm" style="display:none">
          <h3 id="raceFormTitle">ADD RACE</h3>
          <div class="form-grid">
            <div class="form-group"><label class="fg-label">ROUND</label><input id="rRound" type="number" placeholder="1"></div>
            <div class="form-group"><label class="fg-label">RACE NAME</label><input id="rName" placeholder="Monaco Grand Prix"></div>
            <div class="form-group"><label class="fg-label">TRACK</label><input id="rTrack" placeholder="Circuit de Monaco"></div>
            <div class="form-group"><label class="fg-label">DATE</label><input id="rDate" type="date"></div>
            <div class="form-group"><label class="fg-label">LAPS</label><input id="rLaps" type="number" placeholder="50"></div>
          </div>
          <div class="form-actions">
            <button class="btn btn-white" onclick="saveRace()">SAVE</button>
            <button class="btn btn-ghost" onclick="closeRaceForm()">CANCEL</button>
          </div>
        </div>

        <div class="tbl-wrap">
          <table class="adm-table">
            <thead><tr><th>RD</th><th>NAME</th><th>TRACK</th><th>DATE</th><th>LAPS</th><th style="width:110px"></th></tr></thead>
            <tbody id="racesTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- RESULTS -->
      <div class="adm-section" id="sec-results">
        <div class="sec-head"><h2>RESULTS</h2></div>
        <div class="form-group" style="max-width:340px;margin-bottom:1.5rem">
          <label class="fg-label">SELECT RACE</label>
          <select id="resultsRaceSelect" onchange="loadResultsForm()"></select>
        </div>
        <div id="resultsWrap"></div>
      </div>

      <!-- DOTD -->
      <div class="adm-section" id="sec-dotd">
        <div class="sec-head"><h2>DRIVER OF THE DAY</h2></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.9rem;max-width:560px;margin-bottom:1.2rem">
          <div class="form-group">
            <label class="fg-label">RACE</label>
            <select id="dotdRaceSelect" onchange="updateDotdDrivers()"></select>
          </div>
          <div class="form-group">
            <label class="fg-label">DRIVER OF THE DAY</label>
            <select id="dotdDriverSelect"></select>
          </div>
        </div>
        <div id="dotdCurrent" style="color:var(--grey);font-size:0.82rem;margin-bottom:1rem;font-family:var(--fu);letter-spacing:0.04em"></div>
        <button class="btn btn-white" onclick="saveDOTD()">SAVE DOTD</button>
      </div>

      <!-- SEASON -->
      <div class="adm-section" id="sec-season">
        <div class="sec-head"><h2>SEASON SETTINGS</h2></div>
        <div class="form-card" style="max-width:400px">
          <div class="form-group" style="margin-bottom:1rem"><label class="fg-label">SEASON NAME</label><input id="seasonName" placeholder="Season 1"></div>
          <button class="btn btn-white" onclick="saveSeason()">SAVE</button>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BIN_ID     = '6ada83fdac6210605a4a3a74';
const MASTER_KEY = '$2a$10$wTYTzJ9.QfJDLLb52xi7hO4ILuoejGhm9MIlOYUReOH/t3JpyrRPS';
const ADMIN_PASS = '9689';
const BIN_URL    = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let adminData = null;
let adminClass = 'GT3';
let currentSec = 'news';
let editingIdx = null;

// ── AUTH ──────────────────────────────────────────────────
function checkLogin() {
    if (document.getElementById('loginInput').value === ADMIN_PASS) {
        document.getElementById('loginWrap').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadData();
    } else {
        document.getElementById('loginErr').style.display = 'block';
    }
}

// ── DATA ──────────────────────────────────────────────────
function emptyClass() { return { drivers:[], teams:[], races:[], news:[], fantasy:{}, archive:{}, seasonName:'Season 1' }; }
function d() { return adminData?.[adminClass.toLowerCase()] || emptyClass(); }

async function loadData() {
    setStatus('orange','Loading…');
    try {
        const r = await fetch(`${BIN_URL}/latest`, { headers:{'X-Master-Key':MASTER_KEY} });
        const json = await r.json();
        adminData = json.record || { gt3:emptyClass(), gt4:emptyClass() };
        if (!adminData.gt3) adminData.gt3 = emptyClass();
        if (!adminData.gt4) adminData.gt4 = emptyClass();
        setStatus('green','Synced');
        refreshSec();
    } catch(e) { setStatus('red','Error loading'); }
}

async function saveData(msg) {
    setStatus('orange','Saving…');
    try {
        await fetch(BIN_URL, { method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY}, body:JSON.stringify(adminData) });
        setStatus('green','Saved ✓');
        toast(msg || 'Saved!', 'ok');
    } catch(e) { setStatus('red','Save failed'); toast('Error saving!','err'); }
}

// ── STATUS / TOAST ────────────────────────────────────────
function setStatus(col, txt) {
    const c = { green:'#4caf50', orange:'#FF8000', red:'var(--danger)' };
    document.getElementById('syncStatus').innerHTML = `<span class="status-dot" style="background:${c[col]}"></span>${txt}`;
}
function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = `toast ${type||''} show`;
    setTimeout(() => el.classList.remove('show'), 2400);
}

// ── CLASS SWITCH ──────────────────────────────────────────
function switchClass(cls) {
    adminClass = cls;
    document.getElementById('cpGT3').className = 'cp-btn gt3' + (cls==='GT3'?' active':'');
    document.getElementById('cpGT4').className = 'cp-btn gt4' + (cls==='GT4'?' active':'');
    // Close any open forms
    ['newsForm','driverForm','teamForm','raceForm'].forEach(id => document.getElementById(id).style.display='none');
    refreshSec();
}

// ── NAV ───────────────────────────────────────────────────
function showSec(name) {
    currentSec = name;
    document.querySelectorAll('.adm-section').forEach(s => s.classList.remove('active'));
    document.getElementById(`sec-${name}`).classList.add('active');
    document.querySelectorAll('.snav-item').forEach(b => b.classList.toggle('active', b.getAttribute('onclick').includes(`'${name}'`)));
    refreshSec();
}

function refreshSec() {
    if (!adminData) return;
    switch(currentSec) {
        case 'news':    renderNewsTable(); break;
        case 'drivers': renderDriversTable(); break;
        case 'teams':   renderTeamsTable(); break;
        case 'races':   renderRacesTable(); break;
        case 'results': populateResultsSelect(); break;
        case 'dotd':    populateDotdSelects(); break;
        case 'season':  document.getElementById('seasonName').value = d().seasonName||'Season 1'; break;
    }
}

// ── INLINE DELETE ─────────────────────────────────────────
// Returns HTML for action cell with inline confirm
function actionCell(editFn, deleteFn) {
    return `<div class="td-actions">
      <button class="btn btn-ghost btn-sm" onclick="${editFn}">EDIT</button>
      <button class="btn btn-danger btn-sm del-trigger" onclick="showDelConfirm(this, '${deleteFn}')">DEL</button>
    </div>`;
}

function showDelConfirm(btn, fn) {
    const cell = btn.closest('.td-actions');
    cell.innerHTML = `<span style="font-size:0.75rem;color:var(--grey);font-family:var(--fu);letter-spacing:0.06em">Sure?</span>
      <button class="btn btn-confirm btn-sm" onclick="${fn}">YES</button>
      <button class="btn btn-ghost btn-sm" onclick="refreshSec()">NO</button>`;
}

// ── RESULTS ───────────────────────────────────────────────
function populateResultsSelect() {
    const races = d().races||[];
    const sel = document.getElementById('resultsRaceSelect');
    sel.innerHTML = races.length
        ? races.map((r,i) => `<option value="${i}">R${r.round||i+1}: ${r.name}</option>`).join('')
        : '<option>No races — add races first</option>';
    loadResultsForm();
}

function loadResultsForm() {
    const idx = parseInt(document.getElementById('resultsRaceSelect').value);
    const race = d().races?.[idx];
    const wrap = document.getElementById('resultsWrap');
    if (!race) { wrap.innerHTML=''; return; }
    const drivers = d().drivers||[];
    const existing = race.results||[];

    // Build rows (at least 10, or as many as existing results)
    const rowCount = Math.max(existing.length || drivers.length, 10);
    const driverOpts = drivers.map(dr => `<option value="${dr.name}">${dr.name}</option>`).join('');

    const rows = Array.from({length: rowCount}, (_,i) => {
        const res = existing[i];
        const sel = typeof res === 'object' ? res.driver : (res||'');
        const time = typeof res === 'object' ? res.time : '';
        return `<div class="res-row" id="rr${i}">
          <div class="res-pos">P${i+1}</div>
          <select>${driverOpts}${drivers.length?'':'<option>No drivers</option>'}<option value="" ${!sel?'selected':''}>— empty —</option></select>
          <input placeholder="Time / Gap" value="${time||''}">
        </div>`;
    }).join('');

    // Fastest lap select
    const flVal = race.fastestLap||'';
    const flOpts = `<option value="">— None —</option>` + drivers.map(dr => `<option value="${dr.name}" ${dr.name===flVal?'selected':''}>${dr.name}</option>`).join('');

    wrap.innerHTML = `
      <div class="form-card">
        <h3 style="margin-bottom:0.8rem">R${race.round}: ${race.name}</h3>
        <div id="resultsRows">${rows}</div>
        <button class="add-row-btn" onclick="addResultRow()">+ Add Row</button>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.9rem;margin-top:1.2rem;align-items:end">
          <div class="form-group"><label class="fg-label">FASTEST LAP</label><select id="flDriver">${flOpts}</select></div>
          <button class="btn btn-white" onclick="saveResults(${idx})" style="align-self:end">SAVE RESULTS</button>
        </div>
      </div>`;

    // Pre-select existing drivers
    const rowEls = document.querySelectorAll('#resultsRows .res-row');
    rowEls.forEach((row, i) => {
        const res = existing[i];
        if (!res) return;
        const val = typeof res === 'object' ? res.driver : res;
        const s = row.querySelector('select');
        if (s) s.value = val;
    });
}

function addResultRow() {
    const wrap = document.getElementById('resultsRows');
    const pos = wrap.children.length + 1;
    const drivers = d().drivers||[];
    const driverOpts = drivers.map(dr => `<option value="${dr.name}">${dr.name}</option>`).join('');
    const div = document.createElement('div');
    div.className = 'res-row';
    div.id = `rr${pos-1}`;
    div.innerHTML = `<div class="res-pos">P${pos}</div><select>${driverOpts}<option value="">— empty —</option></select><input placeholder="Time / Gap">`;
    wrap.appendChild(div);
}

function saveResults(idx) {
    const rows = Array.from(document.querySelectorAll('#resultsRows .res-row'));
    const results = rows.map(row => ({
        driver: row.querySelector('select').value,
        time:   row.querySelector('input').value.trim()
    })).filter(r => r.driver);
    const fl = document.getElementById('flDriver').value;
    const c = adminClass.toLowerCase();
    adminData[c].races[idx].results = results;
    if (fl) adminData[c].races[idx].fastestLap = fl;
    else delete adminData[c].races[idx].fastestLap;
    saveData('Results saved');
}

// ── DOTD ──────────────────────────────────────────────────
function populateDotdSelects() {
    const races = d().races||[];
    const sel = document.getElementById('dotdRaceSelect');
    sel.innerHTML = races.length
        ? races.map((r,i) => `<option value="${i}">R${r.round||i+1}: ${r.name}</option>`).join('')
        : '<option>No races</option>';
    updateDotdDrivers();
}

function updateDotdDrivers() {
    const idx = parseInt(document.getElementById('dotdRaceSelect').value);
    const race = d().races?.[idx];
    const drivers = d().drivers||[];
    // Prefer to show race finishers in order, then remaining drivers
    const finished = (race?.results||[]).map(r => typeof r==='object'?r.driver:r).filter(Boolean);
    const rest = drivers.map(dr=>dr.name).filter(n => !finished.includes(n));
    const all = [...finished, ...rest];
    const current = race?.dotdWinner||'';
    document.getElementById('dotdDriverSelect').innerHTML = all.map(n => `<option value="${n}" ${n===current?'selected':''}>${n}</option>`).join('') || '<option>No drivers</option>';
    document.getElementById('dotdCurrent').textContent = current ? `Current: ${current}` : 'No winner set yet.';
}

function saveDOTD() {
    const idx = parseInt(document.getElementById('dotdRaceSelect').value);
    const winner = document.getElementById('dotdDriverSelect').value;
    if (!winner) { toast('Select a driver','err'); return; }
    adminData[adminClass.toLowerCase()].races[idx].dotdWinner = winner;
    saveData('DOTD saved');
    document.getElementById('dotdCurrent').textContent = `Current: ${winner}`;
}

// ── SEASON ────────────────────────────────────────────────
function saveSeason() {
    const name = document.getElementById('seasonName').value.trim()||'Season 1';
    adminData[adminClass.toLowerCase()].seasonName = name;
    saveData('Season settings saved');
}

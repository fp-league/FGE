<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGE — Back shortly</title>
    <meta name="description" content="Fortnite Global Endurance is being updated. Back shortly.">
    <meta name="theme-color" content="#450A07">
    <meta name="robots" content="noindex">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FGE">
    <meta property="og:title" content="FGE — Back shortly">
    <meta property="og:description" content="Fortnite Global Endurance is being updated. Back shortly.">
    <meta property="og:url" content="https://fp-league.github.io/FGE/">
    <meta property="og:image" content="https://fp-league.github.io/FGE/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root { --red:#E10600; --bg:#450A07; --deep:#2A0604; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
        min-height:100vh; background:var(--bg); color:#f0f0f0;
        font-family:'Titillium Web','Segoe UI',Arial,sans-serif;
        display:flex; align-items:center; justify-content:center;
        padding:1.5rem; text-align:center; overflow-x:hidden; position:relative;
    }
    body::before {
        content:''; position:absolute; top:-30%; left:50%; transform:translateX(-50%);
        width:140%; height:150%; pointer-events:none;
        background:radial-gradient(ellipse at center, var(--red) 0%, transparent 62%);
        opacity:0.20;
    }
    .wrap { position:relative; z-index:1; max-width:520px; }
    .logo { width:min(62vw,300px); height:auto; display:block; margin:0 auto 1.8rem; }
    .bar {
        width:140px; height:3px; background:var(--red); border-radius:2px;
        margin:0 auto 1.8rem; box-shadow:0 0 18px var(--red);
        animation:pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    h1 {
        font-size:clamp(1.3rem,5vw,1.9rem); font-weight:700; color:#fff;
        letter-spacing:.04em; margin-bottom:.8rem;
    }
    p { color:#cbbaba; line-height:1.65; font-size:.95rem; margin-bottom:.6rem; }
    .soon {
        display:inline-block; margin-top:1.6rem; font-size:.7rem; font-weight:600;
        letter-spacing:.18em; color:#ff8a7a; border:1px solid rgba(225,6,0,.45);
        background:rgba(225,6,0,.12); border-radius:999px; padding:.5rem 1.1rem;
    }
    .foot { margin-top:2.2rem; font-size:.78rem; letter-spacing:.1em; }
    .foot a { color:#cbbaba; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.25); padding-bottom:2px; }
    .foot a:hover { color:#fff; }
</style>
</head>
<body>
    <div class="wrap">
        <img src="fge-logo.webp" alt="FGE — Fortnite Global Endurance" class="logo" width="841" height="309">
        <div class="bar"></div>
        <h1>We're making some upgrades</h1>
        <p>FGE is down briefly while we roll out the new season update.</p>
        <p>Standings, results and driver profiles will all be back shortly.</p>
        <div class="soon">BACK IN A FEW MINUTES</div>
        <div class="foot">
            <a href="https://discord.gg/3MCku8pBjK" target="_blank" rel="noopener">JOIN US ON DISCORD</a>
        </div>
    </div>
<script>
    // Don't let a cached worker keep serving the old site during the window,
    // and auto-return visitors once the real site is back.
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
            .then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    }
    if (window.caches) {
        caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
    }
    setInterval(function () {
        fetch('index.html?ping=' + Date.now(), { cache: 'no-store' })
            .then(r => r.text())
            .then(t => { if (t.indexOf('id="raceStrip"') !== -1) location.reload(); })
            .catch(function () {});
    }, 20000);
</script>
</body>
</html>
